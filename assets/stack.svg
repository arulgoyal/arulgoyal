<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" fill="none" role="img" aria-label="Runtime dependencies: TypeScript, NestJS, Node.js, PostgreSQL, Redis, BullMQ, AWS SQS, AWS SNS, AWS S3, TypeORM, Docker, Spring Boot, Java, React, Next.js, Tailwind, Python, SQL, C++, Git.">
