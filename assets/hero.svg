<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" fill="none" role="img" aria-label="Arul Goyal — Backend Engineer, Payments and Reconciliation. All systems operational.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161e"/>
      <stop offset="0.5" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#7dcfff;#7aa2f7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#bb9af7">
        <animate attributeName="stop-color" values="#bb9af7;#7dcfff;#7aa2f7;#bb9af7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7dcfff">
        <animate attributeName="stop-color" values="#7dcfff;#7aa2f7;#bb9af7;#7dcfff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7aa2f7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#2e3450" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip"><rect x="8" y="8" width="984" height="304" rx="20"/></clipPath>
    <clipPath id="type">
      <rect x="66" y="270" width="0" height="26">
        <animate attributeName="width" values="0;0;560" keyTimes="0;0.12;1" dur="3s" begin="0.5s" fill="freeze"/>
      </rect>
    </clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',ui-monospace,Consolas,monospace;}
      .sans{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
    </style>
  </defs>

  <!-- panel -->
  <rect x="8" y="8" width="984" height="304" rx="20" fill="url(#bg)" stroke="#2e3450" stroke-width="1.5"/>
  <rect x="8" y="8" width="984" height="304" rx="20" fill="url(#grid)"/>

  <!-- scanline sweep -->
  <g clip-path="url(#panelClip)">
    <rect x="8" y="-60" width="984" height="46" fill="url(#scan)" opacity="0.10">
      <animate attributeName="y" values="-60;330" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- window chrome -->
  <circle cx="40" cy="42" r="6" fill="#ff5f56"/>
  <circle cx="62" cy="42" r="6" fill="#ffbd2e"/>
  <circle cx="84" cy="42" r="6" fill="#27c93f"/>
  <text x="112" y="47" class="mono" font-size="14" fill="#565f89">arul-goyal.service — production</text>

  <!-- operational status, top-right -->
  <circle cx="790" cy="42" r="5" fill="#9ece6a">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;6.5;5" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="804" y="47" class="mono" font-size="13" fill="#9ece6a" letter-spacing="1.6">ALL SYSTEMS OPERATIONAL</text>

  <!-- name -->
  <text x="44" y="136" class="sans" font-size="68" font-weight="800" fill="url(#name)" filter="url(#glow)">Arul Goyal</text>
  <rect x="48" y="154" width="440" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- subtitle -->
  <text x="48" y="190" class="sans" font-size="21" fill="#c0caf5">Backend Engineer <tspan fill="#565f89">·</tspan> Payments <tspan fill="#565f89">&amp;</tspan> Reconciliation <tspan fill="#565f89">·</tspan> Rupeek</text>

  <!-- vitals / ECG heartbeat -->
  <g transform="translate(660,96)">
    <text x="0" y="-6" class="mono" font-size="12" fill="#565f89" letter-spacing="1">vitals — healthy</text>
    <path d="M0,22 H58 l8,-16 l9,32 l11,-44 l9,46 l8,-18 H150 l8,-14 l9,28 l11,-40 l9,42 l8,-16 H300"
          fill="none" stroke="#9ece6a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="420" stroke-dashoffset="420">
      <animate attributeName="stroke-dashoffset" values="420;0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- KPI chips -->
  <g class="mono" font-size="12.5">
    <g opacity="0">
      <animate attributeName="opacity" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
      <rect x="46" y="212" width="188" height="30" rx="15" fill="#1f2335" stroke="#2e3450"/>
      <circle cx="64" cy="227" r="4" fill="#9ece6a"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="76" y="231.5" fill="#a9b1d6">Δ = 0.00 · reconciled</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
      <rect x="246" y="212" width="150" height="30" rx="15" fill="#1f2335" stroke="#2e3450"/>
      <circle cx="264" cy="227" r="4" fill="#7aa2f7"><animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle>
      <text x="276" y="231.5" fill="#a9b1d6">uptime 99.99%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" to="1" dur="0.5s" begin="1.2s" fill="freeze"/>
      <rect x="408" y="212" width="140" height="30" rx="15" fill="#1f2335" stroke="#2e3450"/>
      <circle cx="426" cy="227" r="4" fill="#bb9af7"><animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>
      <text x="438" y="231.5" fill="#a9b1d6">dlq drained ↺</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>
      <rect x="560" y="212" width="172" height="30" rx="15" fill="#1f2335" stroke="#2e3450"/>
      <circle cx="578" cy="227" r="4" fill="#e0af68"><animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.9s" repeatCount="indefinite"/></circle>
      <text x="590" y="231.5" fill="#a9b1d6">3am retries: armed</text>
    </g>
  </g>

  <!-- telemetry typing line -->
  <text x="48" y="288" class="mono" font-size="15" fill="#7aa2f7">$</text>
  <g clip-path="url(#type)">
    <text x="66" y="288" class="mono" font-size="15" fill="#a9b1d6">tail -f prod | grep settled — every rupee accounted for</text>
  </g>
  <rect x="66" y="275" width="9" height="16" fill="#9ece6a">
    <animate attributeName="x" values="66;66;562" keyTimes="0;0.12;1" dur="3s" begin="0.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
