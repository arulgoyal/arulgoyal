<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" fill="none" role="img" aria-label="Live money-movement pipeline: payment intent flows through queue and processor to a settled ledger; failures drop to the dead-letter queue and retry back automatically.">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161e"/>
      <stop offset="1" stop-color="#1f2335"/>
    </linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',ui-monospace,Consolas,monospace;}
    </style>
  </defs>

  <!-- panel -->
  <rect x="8" y="8" width="984" height="224" rx="20" fill="url(#pbg)" stroke="#2e3450" stroke-width="1.5"/>

  <!-- title -->
  <circle cx="42" cy="40" r="4.5" fill="#9ece6a">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="56" y="45" class="mono" font-size="14" fill="#a9b1d6" letter-spacing="1">money-movement pipeline <tspan fill="#565f89">— live · zero manual ops</tspan></text>

  <!-- static route lines -->
  <line x1="70" y1="105" x2="930" y2="105" stroke="#2e3450" stroke-width="2"/>
  <!-- fail route: processor -> dlq -> back to queue (dashed) -->
  <path d="M547,127 L547,178 L327,178 L327,127" stroke="#3b3f58" stroke-width="1.6" stroke-dasharray="5 5" fill="none"/>

  <!-- edge labels -->
  <text x="196" y="97" class="mono" font-size="11" fill="#565f89">enqueue</text>
  <text x="418" y="97" class="mono" font-size="11" fill="#565f89">process</text>
  <text x="640" y="97" class="mono" font-size="11" fill="#565f89">post</text>
  <text x="558" y="152" class="mono" font-size="11" fill="#f7768e">fail ↓</text>
  <text x="412" y="170" class="mono" font-size="11" fill="#e0af68">retry ↺ idempotent</text>

  <!-- nodes -->
  <g class="mono" font-size="13.5">
    <rect x="52" y="83" width="130" height="44" rx="10" fill="#1a1b27" stroke="#7aa2f7" stroke-width="1.6"/>
    <text x="117" y="110" fill="#c0caf5" text-anchor="middle">intent ₹</text>

    <rect x="252" y="83" width="150" height="44" rx="10" fill="#1a1b27" stroke="#bb9af7" stroke-width="1.6"/>
    <text x="327" y="110" fill="#c0caf5" text-anchor="middle">queue · bullmq</text>

    <rect x="472" y="83" width="150" height="44" rx="10" fill="#1a1b27" stroke="#7dcfff" stroke-width="1.6"/>
    <text x="547" y="110" fill="#c0caf5" text-anchor="middle">processor</text>

    <rect x="692" y="83" width="240" height="44" rx="10" fill="#1a1b27" stroke="#9ece6a" stroke-width="1.6"/>
    <text x="800" y="110" fill="#c0caf5" text-anchor="middle">ledger · settled <tspan fill="#9ece6a">✓<animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></tspan></text>

    <!-- DLQ node -->
    <rect x="472" y="158" width="150" height="40" rx="10" fill="#1a1b27" stroke="#f7768e" stroke-width="1.6"/>
    <text x="547" y="183" fill="#f7768e" text-anchor="middle">dead-letter q</text>
  </g>

  <!-- happy-path transactions -->
  <circle r="5.5" fill="#9ece6a">
    <animateMotion path="M70,105 H930" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="5.5" fill="#9ece6a" opacity="0.85">
    <animateMotion path="M70,105 H930" dur="4.5s" begin="-2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- failing transaction: drops to DLQ, waits, retries back into the queue, settles -->
  <circle r="5.5">
    <animate attributeName="fill" values="#f7768e;#f7768e;#e0af68;#9ece6a;#9ece6a" keyTimes="0;0.42;0.62;0.8;1" dur="9s" repeatCount="indefinite"/>
    <animateMotion
      path="M70,105 L547,105 L547,178 L327,178 L327,105 L930,105"
      keyPoints="0;0.35;0.42;0.58;0.62;1" keyTimes="0;0.3;0.42;0.55;0.62;1"
      calcMode="linear" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- footer note -->
  <text x="930" y="218" class="mono" font-size="11" fill="#565f89" text-anchor="end">attempt 2 → settled · Δ = 0.00 · humans not paged</text>
</svg>
