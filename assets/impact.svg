<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" fill="none" role="img" aria-label="Impact: 4 lending partners live, 0 manual re-pushes per day, 15 plus production features shipped, about 10 hours per week of toil deleted.">
  <defs>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',ui-monospace,Consolas,monospace;}
      .sans{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
    </style>
  </defs>

  <g>
    <rect x="20" y="14" width="225" height="122" rx="16" fill="#1a1b27" stroke="#2e3450" stroke-width="1.5"/>
    <g opacity="0"><animate attributeName="opacity" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
      <text x="44" y="72" class="sans" font-size="40" font-weight="800" fill="url(#num)">4+</text>
      <text x="44" y="100" class="mono" font-size="12.5" fill="#a9b1d6">languages in production</text>
      <text x="44" y="118" class="mono" font-size="10.5" fill="#565f89">TS · Java · Python · SQL</text>
    </g>
    <rect x="44" y="82" height="3" rx="1.5" fill="#7aa2f7" width="0"><animate attributeName="width" to="176" dur="0.9s" begin="0.4s" fill="freeze"/></rect>
  </g>

  <g>
    <rect x="265" y="14" width="225" height="122" rx="16" fill="#1a1b27" stroke="#2e3450" stroke-width="1.5"/>
    <g opacity="0"><animate attributeName="opacity" to="1" dur="0.6s" begin="0.45s" fill="freeze"/>
      <text x="289" y="72" class="sans" font-size="40" font-weight="800" fill="#9ece6a">0→1</text>
      <text x="289" y="100" class="mono" font-size="12.5" fill="#a9b1d6">products built from scratch</text>
      <text x="289" y="118" class="mono" font-size="10.5" fill="#565f89">backends · dashboards · bots</text>
    </g>
    <rect x="289" y="82" height="3" rx="1.5" fill="#9ece6a" width="0"><animate attributeName="width" to="176" dur="0.9s" begin="0.65s" fill="freeze"/></rect>
  </g>

  <g>
    <rect x="510" y="14" width="225" height="122" rx="16" fill="#1a1b27" stroke="#2e3450" stroke-width="1.5"/>
    <g opacity="0"><animate attributeName="opacity" to="1" dur="0.6s" begin="0.7s" fill="freeze"/>
      <text x="534" y="72" class="sans" font-size="40" font-weight="800" fill="url(#num)">15+</text>
      <text x="534" y="100" class="mono" font-size="12.5" fill="#a9b1d6">prod features shipped</text>
      <text x="534" y="118" class="mono" font-size="10.5" fill="#565f89">APIs · queues · integrations</text>
    </g>
    <rect x="534" y="82" height="3" rx="1.5" fill="#bb9af7" width="0"><animate attributeName="width" to="176" dur="0.9s" begin="0.9s" fill="freeze"/></rect>
  </g>

  <g>
    <rect x="755" y="14" width="225" height="122" rx="16" fill="#1a1b27" stroke="#2e3450" stroke-width="1.5"/>
    <g opacity="0"><animate attributeName="opacity" to="1" dur="0.6s" begin="0.95s" fill="freeze"/>
      <text x="779" y="72" class="sans" font-size="40" font-weight="800" fill="#7dcfff">10d</text>
      <text x="779" y="100" class="mono" font-size="12.5" fill="#a9b1d6">idea → production, fastest</text>
      <text x="779" y="118" class="mono" font-size="10.5" fill="#565f89">new vendor API, learned + live</text>
    </g>
    <rect x="779" y="82" height="3" rx="1.5" fill="#7dcfff" width="0"><animate attributeName="width" to="176" dur="0.9s" begin="1.15s" fill="freeze"/></rect>
  </g>
</svg>
