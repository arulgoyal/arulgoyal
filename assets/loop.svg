<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" fill="none" role="img" aria-label="The learning loop: explore, build, break, learn, ship — repeat forever. Each loop gets faster.">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161e"/>
      <stop offset="1" stop-color="#1f2335"/>
    </linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',ui-monospace,Consolas,monospace;}
    </style>
  </defs>

  <!-- panel -->
  <rect x="8" y="8" width="984" height="224" rx="20" fill="url(#lbg)" stroke="#2e3450" stroke-width="1.5"/>

  <!-- title -->
  <circle cx="42" cy="40" r="4.5" fill="#bb9af7">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="56" y="45" class="mono" font-size="14" fill="#a9b1d6" letter-spacing="1">the learning loop <tspan fill="#565f89">— how I pick up anything · runs on repeat</tspan></text>

  <!-- static route lines -->
  <line x1="120" y1="105" x2="860" y2="105" stroke="#2e3450" stroke-width="2"/>
  <path d="M860,105 L860,178 L120,178 L120,105" stroke="#3b3f58" stroke-width="1.6" stroke-dasharray="5 5" fill="none"/>

  <!-- edge labels -->
  <text x="196" y="97" class="mono" font-size="11" fill="#565f89">curiosity</text>
  <text x="382" y="97" class="mono" font-size="11" fill="#565f89">mvp fast</text>
  <text x="556" y="97" class="mono" font-size="11" fill="#565f89">on purpose</text>
  <text x="728" y="97" class="mono" font-size="11" fill="#565f89">for real</text>
  <text x="430" y="196" class="mono" font-size="11" fill="#e0af68">repeat ∞ — each loop gets faster</text>

  <!-- nodes -->
  <g class="mono" font-size="13.5">
    <rect x="60" y="83" width="120" height="44" rx="10" fill="#1a1b27" stroke="#7aa2f7" stroke-width="1.6"/>
    <text x="120" y="110" fill="#c0caf5" text-anchor="middle">explore</text>

    <rect x="250" y="83" width="110" height="44" rx="10" fill="#1a1b27" stroke="#bb9af7" stroke-width="1.6"/>
    <text x="305" y="110" fill="#c0caf5" text-anchor="middle">build</text>

    <rect x="430" y="83" width="110" height="44" rx="10" fill="#1a1b27" stroke="#f7768e" stroke-width="1.6"/>
    <text x="485" y="110" fill="#c0caf5" text-anchor="middle">break</text>

    <rect x="610" y="83" width="110" height="44" rx="10" fill="#1a1b27" stroke="#e0af68" stroke-width="1.6"/>
    <text x="665" y="110" fill="#c0caf5" text-anchor="middle">learn</text>

    <rect x="790" y="83" width="140" height="44" rx="10" fill="#1a1b27" stroke="#9ece6a" stroke-width="1.6"/>
    <text x="860" y="110" fill="#c0caf5" text-anchor="middle">ship <tspan fill="#9ece6a">✓<animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- cycling dots: color morphs at each stage -->
  <circle r="5.5">
    <animate attributeName="fill" values="#7aa2f7;#bb9af7;#f7768e;#e0af68;#9ece6a;#7aa2f7" keyTimes="0;0.11;0.22;0.33;0.44;1" dur="9s" repeatCount="indefinite"/>
    <animateMotion path="M120,105 H860 V178 H120 Z" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="5.5" opacity="0.8">
    <animate attributeName="fill" values="#7aa2f7;#bb9af7;#f7768e;#e0af68;#9ece6a;#7aa2f7" keyTimes="0;0.11;0.22;0.33;0.44;1" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
    <animateMotion path="M120,105 H860 V178 H120 Z" dur="9s" begin="-4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- footer note -->
  <text x="930" y="218" class="mono" font-size="11" fill="#565f89" text-anchor="end">same loop shipped: NestJS · Spring Boot · React · queues · automations</text>
</svg>
