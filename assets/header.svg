<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" fill="none" role="img" aria-label="Arul Goyal — Backend Engineer, Payments and Reconciliation. Status: all systems operational.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="0.55" stop-color="#1f2335"/>
      <stop offset="1" stop-color="#292e42"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type">
      <rect x="60" y="224" width="0" height="24">
        <animate attributeName="width" values="0;0;540" keyTimes="0;0.14;1" dur="2.8s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',ui-monospace,Consolas,monospace;}
      .sans{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
    </style>
  </defs>

  <!-- panel -->
  <rect x="8" y="8" width="984" height="264" rx="20" fill="url(#bg)" stroke="#2e3450" stroke-width="1.5"/>

  <!-- window chrome -->
  <circle cx="40" cy="42" r="6" fill="#ff5f56"/>
  <circle cx="62" cy="42" r="6" fill="#ffbd2e"/>
  <circle cx="84" cy="42" r="6" fill="#27c93f"/>
  <text x="112" y="47" class="mono" font-size="14" fill="#565f89">arul-goyal.service</text>

  <!-- operational status, top-right -->
  <circle cx="806" cy="42" r="5" fill="#9ece6a">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;6.5;5" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="820" y="47" class="mono" font-size="13" fill="#9ece6a" letter-spacing="1.6">ALL SYSTEMS OPERATIONAL</text>

  <!-- name -->
  <text x="42" y="132" class="sans" font-size="62" font-weight="800" fill="url(#name)" filter="url(#glow)">Arul Goyal</text>
  <rect x="46" y="150" width="430" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- subtitle -->
  <text x="46" y="186" class="sans" font-size="20" fill="#c0caf5">Backend Engineer <tspan fill="#565f89">·</tspan> Payments <tspan fill="#565f89">&amp;</tspan> Reconciliation</text>

  <!-- vitals / ECG heartbeat -->
  <g transform="translate(636,92)">
    <text x="0" y="-4" class="mono" font-size="12" fill="#565f89" letter-spacing="1">vitals — healthy</text>
    <path d="M0,22 H58 l8,-16 l9,32 l11,-44 l9,46 l8,-18 H150 l8,-14 l9,28 l11,-40 l9,42 l8,-16 H316"
          fill="none" stroke="#9ece6a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="430" stroke-dashoffset="430">
      <animate attributeName="stroke-dashoffset" values="430;0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- telemetry typing line -->
  <text x="44" y="242" class="mono" font-size="15" fill="#7aa2f7">$</text>
  <g clip-path="url(#type)">
    <text x="60" y="242" class="mono" font-size="15" fill="#a9b1d6">reconciliation Δ = 0.00 · dlq draining · retries idempotent</text>
  </g>
  <rect x="60" y="230" width="9" height="15" fill="#9ece6a">
    <animate attributeName="x" values="60;60;548" keyTimes="0;0.14;1" dur="2.8s" begin="0.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
